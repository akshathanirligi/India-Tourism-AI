services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    # Keeps the existing MongoDB, JWT, CORS, and API configuration unchanged.
    env_file:
      - ./backend/.env
    environment:
      NODE_ENV: production
      PORT: "5000"
    ports:
      - "5000:5000"
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        # Override before building when the app is accessed through a public API URL.
        VITE_API_URL: ${VITE_API_URL:-http://localhost:5000/api}
    depends_on:
      - backend
    ports:
      - "5177:80"
    restart: unless-stopped
